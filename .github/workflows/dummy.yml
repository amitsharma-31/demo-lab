name: Pip Cache Demo

on: [workflow_dispatch, push]
 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Set up Python with built-in pip caching
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Specify your required Python version
          cache: 'pip'             # Automatically caches ~/.cache/pip keyed on requirements.txt

      # 3. Install Python modules using pip
      - name: Install Pip Dependencies
        run: |
          python -m pip install --upgrade pip
          # Force pip to use the restored cache folder first 
          pip install --find-links=~/.cache/pip -r requirements.txt --verbose
