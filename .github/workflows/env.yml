name: Deploy Demo

on: [push, workflow_dispatch]

jobs:
  deploy-dev:
    name: Deploy Dev
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: 
      name: dev
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Show variable value
        run: |
          echo "Running DEV deployment"
          echo "APP_URL=${{ vars.APP_URL }}"

  deploy-prod:
    name: Deploy Prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Show variable value
        run: |
          echo "Running DEV deployment"
          echo "APP_URL=${{ vars.APP_URL }}"

      - name: Show variable value
        run: |
          echo "Running PROD deployment"
          echo "APP_URL=${{ vars.APP_URL }}"
