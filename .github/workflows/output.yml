name: GitHub Actions Multi-Job Output Demo

on: [workflow_dispatch, push]

jobs:
  # Job 1: Generates the version
  build-job:
    runs-on: ubuntu-latest
    # Map the step output to a job-level output
    outputs:
      job_version: ${{ steps.version_generator.outputs.app_version }}
    
    steps:
      - name: Generate Version Number
        id: version_generator
        run: |
          FULL_VERSION="v1.0.${{ github.run_number }}"
          echo "app_version=$FULL_VERSION" >> $GITHUB_OUTPUT

  # Job 2: Waits for Job 1 and uses its output
  deploy-job:
    runs-on: ubuntu-latest
    needs: build-job # Crucial: This ensures deploy-job runs AFTER build-job finishes
    
    steps:
      - name: Use Version from Build Job
        run: |
          # Fetch the output using the needs context
          echo "Deploying version: ${{ needs.build-job.outputs.job_version }}"
